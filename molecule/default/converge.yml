---
- name: Converge
  hosts: all
  vars:
    database_password: "1234"
    database_root_password: "5678"
    database_backup_user_password: "5432"
    database_backup_enabled: true
    database_backup_output_path: "/var/tmp/db_backups"
    database_backup_schedule: "*-*-* *:*:00"   # Systemd OnCalendar format
    database_backup_keep: 4
  tasks:
    - name: Include opencast_mariadb
      ansible.builtin.include_role:
        name: elan.opencast_mariadb
